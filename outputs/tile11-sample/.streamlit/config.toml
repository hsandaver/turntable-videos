[theme]
base = "light"
primaryColor = "#A34A28"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F2EEE7"
textColor = "#2A2521"
borderColor = "#E3DDD2"
dataframeBorderColor = "#E3DDD2"
